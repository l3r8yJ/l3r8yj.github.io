<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% seo %}
{% if site.keywords or page.tags %}
<meta
  name="keywords"
  content="{% if page.tags %}{{ page.tags | join: ',' }}{% else %}{{
    site.keywords | join: ','
  }}{% endif %}" />
{% endif %}
<link rel="shortcut icon" href="{{ site.baseurl }}/favicon.svg" />
<link rel="apple-touch-icon" href="{{ site.baseurl }}/favicon.svg" />
<link
  rel="alternate"
  type="application/rss+xml"
  title="{{ site.title }} - {{ site.description }}"
  href="{{ site.baseurl }}/feed.xml" />
<link
  rel="stylesheet"
  type="text/css"
  href="{{ site.baseurl }}/assets/css/base.css" />
<link
  rel="stylesheet"
  type="text/css"
  href="{{ site.baseurl }}/assets/css/highlight.css" />
<script>
  (function () {
    var root = document.documentElement;
    try {
      var stored = localStorage.getItem("theme");
      if (stored === "dark" || stored === "light") root.dataset.theme = stored;
    } catch (error) {}
    document.addEventListener("DOMContentLoaded", function () {
      var button = document.querySelector(".theme-toggle");
      if (!button) return;
      function active() {
        return (
          root.dataset.theme ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light")
        );
      }
      function render() {
        button.textContent = active() === "dark" ? "Light mode" : "Dark mode";
      }
      button.addEventListener("click", function () {
        var next = active() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try {
          localStorage.setItem("theme", next);
        } catch (error) {}
        render();
      });
      render();
    });
  })();
</script>
{% if site.analytics %}
  {% include analytics.html %}
{% endif %}
{% if site.mathjax %}
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML"
  async>
</script>
{% endif %}
{% if site.diagram %}
<script src="{{ site.baseurl }}/assets/scripts/jekyllpaper.js" async></script>
<script
  src="https://unpkg.com/mermaid@8.5.1/dist/mermaid.min.js"
  onload="javascript:loadMermaid();"
  async>
</script>
{% endif %}
